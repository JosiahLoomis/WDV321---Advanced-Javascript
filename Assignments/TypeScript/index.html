<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <script type="module" src="src/script.js"></script>
</head>
<body>
    <h1>Tip Calculator</h1>

    <form id="tipForm">
        <label for="cost">Cost:</label>
        <input type="number" step="0.01" id="cost" name="cost">

        <label for="tipPercent">Tip percent: </label>
        <select id="tipPercent" name="tipPercent">
            <option value="">Select tip amount</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
        </select>

        <button type="submit">Calculate tip</button>
    </form>

    <div>
        <p>Amount to tip: <span id="tipAmount"></span></p>
    </div>
</body>
