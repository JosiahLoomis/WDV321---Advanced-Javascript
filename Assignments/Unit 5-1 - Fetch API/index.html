<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fetch API Data Example</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <h1>Demonstrate Fetch Countries API</h1>

  <div id="controls">
    <button type="button" id="search-button">Show Countries</button>
  </div>

  <div id="status"></div>
  <template id="resultTemplate">
    <div class="card">
      <h4 class="name"></h4>
      <p class="currencies"></p>
      <p class="capitals"></p>
    </div>
  </template>
  <div id="results"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
