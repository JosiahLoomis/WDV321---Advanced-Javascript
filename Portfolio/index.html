<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Recipes</title>
    <style>
        .recipe-card {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
    <script type="module" src="scripts/home.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Recipes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="add.html">Add Recipe</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Recipe Grid Container -->
    <div class="container mt-4">
        <div class="row g-4" id="cards">
            
            <!-- Recipe Card 1 -->
            <template id="cardTemplate">
                <div class="col-12 col-md-6 col-lg-4">
                    <a href="recipe.html?id=1" class="recipe-card">
                        <div class="card h-100">
                            <img src="https://pub-aaa82e9851064d22b954c3ebbafc9ae6.r2.dev/legacy/webp/burger-with-melted-cheese-m-Y1i3jpYYJZYfOEfX5dX.webp" class="card-img-top" alt="Burger">
                            <div class="card-body">
                                <h5 class="card-title">Recipe Name</h5>
                                <p class="card-text">This is the description of the recipe. A brief description will be put here describing the recipe.</p>
                                <span class="badge bg-primary info-badge">
                                    <i class="bi bi-people"></i> Serves: <span class="servings">5</span>
                                </span>
                                <span class="badge bg-success info-badge">
                                    <i class="bi bi-clock"></i> Cook Time: <span class="cook-time">30min</span>
                                </span>
                                <span class="badge bg-warning text-dark info-badge">
                                    <i class="bi bi-speedometer2"></i> Difficulty: <span class="difficulty">Normal</span>
                                </span>
                            </div>
                        </div>
                    </a>
                </div>
            </template>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
